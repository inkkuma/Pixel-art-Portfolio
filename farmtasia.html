  <script>
/* Carrusel + lightbox compartidos por todas las páginas de proyecto */
(function () {
  function init() {
    const track = document.getElementById('carousel-track');
    if (!track) return;

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const counter = document.getElementById('carousel-counter');
    const wrap = track.parentElement;
    const slides = track.children.length;
    const AUTOPLAY_DELAY = 5000; // 5 segundos
    let index = 0;
    let timer = null;

    function update() {
      track.style.transform = 'translateX(-' + (index * 100) + '%)';
      if (counter) counter.textContent = (index + 1) + ' / ' + slides;
    }

    function go(step) {
      index = (index + step + slides) % slides; // bucle infinito
      update();
    }

    function stop() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function start() {
      stop();
      timer = setInterval(function () { go(1); }, AUTOPLAY_DELAY);
    }

    if (prevBtn) prevBtn.addEventListener('click', function () { go(-1); start(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { go(1); start(); });

    // Swipe en móvil
    let startX = null;
    wrap.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
    }, { passive: true });
    wrap.addEventListener('touchend', function (e) {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) { go(dx < 0 ? 1 : -1); start(); }
      startX = null;
    });

    // Lightbox: el autoplay se pausa solo mientras la imagen está ampliada
    const overlay = document.getElementById('lightbox-overlay');
    const overlayImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close');

    function openLightbox(src, alt) {
      overlayImg.src = src;
      overlayImg.alt = alt || '';
      overlay.classList.add('active');
      stop();
    }

    function closeLightbox() {
      overlay.classList.remove('active');
      overlayImg.src = '';
      start();
    }

    if (overlay && overlayImg) {
      Array.prototype.forEach.call(track.children, function (img) {
        img.addEventListener('click', function () { openLightbox(img.src, img.alt); });
      });
      if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeLightbox();
      });
    }

    // Teclado: flechas y Escape
    document.addEventListener('keydown', function (e) {
      if (overlay && overlay.classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        return;
      }
      if (e.key === 'ArrowLeft') { go(-1); start(); }
      if (e.key === 'ArrowRight') { go(1); start(); }
    });

    update();
    start();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
