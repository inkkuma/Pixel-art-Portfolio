  <script>
    (function () {
      const track = document.getElementById('carousel-track');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const counter = document.getElementById('carousel-counter');
      const slides = track.children.length;
      let index = 0;

      const AUTOPLAY_DELAY = 3000;
      let autoplayTimer = null;

      function update() {
        track.style.transform = `translateX(-${index * 100}%)`;
        counter.textContent = `${index + 1} / ${slides}`;
      }

      function goNext() {
        index = (index + 1) % slides;
        update();
      }

      function goPrev() {
        index = (index - 1 + slides) % slides;
        update();
      }

      function startAutoplay() {
        stopAutoplay();
        autoplayTimer = setInterval(goNext, AUTOPLAY_DELAY);
      }

      function stopAutoplay() {
        if (autoplayTimer) {
          clearInterval(autoplayTimer);
          autoplayTimer = null;
        }
      }

      prevBtn.addEventListener('click', () => {
        goPrev();
        startAutoplay(); // reinicia el temporizador tras interacción manual
      });

      nextBtn.addEventListener('click', () => {
        goNext();
        startAutoplay();
      });

      // Lightbox: ampliar imagen al hacer clic
      const overlay = document.getElementById('lightbox-overlay');
      const overlayImg = document.getElementById('lightbox-img');
      const closeBtn = document.getElementById('lightbox-close');

      function openLightbox(src, alt) {
        overlayImg.src = src;
        overlayImg.alt = alt || '';
        overlay.classList.add('active');
        stopAutoplay();
      }

      function closeLightbox() {
        overlay.classList.remove('active');
        overlayImg.src = '';
        startAutoplay();
      }

      Array.from(track.children).forEach((img) => {
        img.addEventListener('click', () => openLightbox(img.src, img.alt));
      });

      closeBtn.addEventListener('click', closeLightbox);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('active')) closeLightbox();
      });

      update();
      startAutoplay();
    })();
  </script>
