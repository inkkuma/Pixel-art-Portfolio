<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gamejams - Portafolio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Logo" />
    </a>
    <nav class="main-nav">
      <a href="index.html" class="active">Main</a>
      <a href="farmtasia.html">Farmtasia</a>
      <a href="Gamejams.html">Game Jams</a>
      <a href="PersonalWork.html">Personal Work</a>
    </nav>
    <a class="contact-link" href="mailto:tu-correo@ejemplo.com">Contacto</a>
  </header>

  <section class="project-header">
    <h1>Personal Work</h1>
    <p class="role">Rol / disciplina, 2024</p>
  </section>

  <section class="carousel">
    <div class="carousel-track-wrap">
      <div class="carousel-track" id="carousel-track">
        <img src="images/EJEMPLO PEGATINA ANIMADA.gif" alt="Proyecto 1" />
        <img src="images/PORTADA 2.gif" alt="Proyecto 2" />
        <img src="images/PORTADA 3.gif" alt="Proyecto 3" />
        <img src="images/proyecto2/img4.png" alt="Proyecto 4" />
      </div>
      <button class="carousel-btn prev" id="prev-btn" aria-label="Anterior">&#10094;</button>
      <button class="carousel-btn next" id="next-btn" aria-label="Siguiente">&#10095;</button>
    </div>
    <p class="carousel-counter"><span id="carousel-counter">1 / 4</span></p>
  </section>

  <section class="gallery">
    <img src="images/Mark.gif" alt="Galería 1" />
    <img src="images/proyecto2/gal2.png" alt="Galería 2" />
    <img src="images/proyecto2/gal3.png" alt="Galería 3" />
    <img src="images/proyecto2/gal4.png" alt="Galería 4" />
    <img src="images/proyecto2/gal5.png" alt="Galería 5" />
    <img src="images/proyecto2/gal6.png" alt="Galería 6" />
  </section>

  <footer class="site-footer">
    <div class="socials">
      <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://twitter.com/" target="_blank" rel="noopener">Twitter</a>
      <a href="mailto:tu-correo@ejemplo.com">Contacto</a>
    </div>
    <p>&copy; 2026 Inkkuma</p>
  </footer>

  <script>
    (function () {
      const track = document.getElementById('carousel-track');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const counter = document.getElementById('carousel-counter');
      const slides = track.children.length;
      let index = 0;

      function update() {
        track.style.transform = `translateX(-${index * 100}%)`;
        counter.textContent = `${index + 1} / ${slides}`;
      }

      prevBtn.addEventListener('click', () => {
        index = (index - 1 + slides) % slides;
        update();
      });

      nextBtn.addEventListener('click', () => {
        index = (index + 1) % slides;
        update();
      });

      update();
    })();
  </script>

</body>
</html>
